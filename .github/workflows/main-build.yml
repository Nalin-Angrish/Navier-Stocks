# =============================================================================
# Main Build — build + push Docker image on push to main
# =============================================================================
# Every merge to main produces a nalinangrish/navier-stocks:latest image.
# This is the "stable" channel consumed by production deployments.
# =============================================================================

name: main-build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: nalinangrish/navier-stocks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
