# =============================================================================
# Release — build + push Docker image and create GitHub Release on tag push
# =============================================================================
# Pushing a semver tag (e.g. v1.2.3) triggers:
#   1. Build & push nalinangrish/navier-stocks:<version>
#   2. Build & push nalinangrish/navier-stocks:latest
#   3. Create a GitHub Release with auto-generated changelog
# =============================================================================

name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Extract semver from tag
        id: semver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            nalinangrish/navier-stocks:${{ steps.semver.outputs.version }}
            nalinangrish/navier-stocks:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
