# =============================================================================
# Lint & Format — static analysis and formatting checks on PRs
# =============================================================================
# Runs golangci-lint for deep static analysis and gofmt to enforce consistent
# code style.  Both run on every commit pushed to an open PR.
# =============================================================================

name: lint-format

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "  ❌ The following files are not gofmt-compliant:"
            echo "$unformatted" | sed 's/^/    - /'
            echo ""
            echo "     Run 'gofmt -l -w .' to fix them."
            exit 1
          fi
          echo "  ✓ All files are properly formatted."
