# =============================================================================
# PR Build — build + push Docker image on every PR commit
# =============================================================================
# Triggered when a PR is opened or new commits are pushed to it.
# Tags the image as nalinangrish/navier-stocks:pr-<number> so reviewers can
# pull and test the exact artifact before merging.
# Multi-arch: linux/amd64 + linux/arm64 (for ARM servers).
# =============================================================================

name: pr-build

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nalinangrish/navier-stocks:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
