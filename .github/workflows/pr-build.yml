# =============================================================================
# PR Build — build + push Docker image on every PR commit
# =============================================================================
# Triggered when a PR is opened or new commits are pushed to it.
# Tags the image as nalinangrish/navier-stocks:pr-<number> so reviewers can
# pull and test the exact artifact before merging.
# =============================================================================

name: pr-build

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: nalinangrish/navier-stocks:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
