# =============================================================================
# Deps — weekly dependency tidy, auto-opens a PR if go.mod/go.sum change
# =============================================================================
# Runs every Monday at 06:00 UTC.  If go mod tidy produces any diff, a pull
# request is created for review.  No PR is opened when nothing changed.
# =============================================================================

name: deps

on:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache: true

      - name: Tidy and verify
        run: |
          go mod tidy
          go mod verify

      - name: Create PR if changed
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: tidy go module dependencies"
          title: "chore: tidy go module dependencies"
          body: |
            Weekly `go mod tidy && go mod verify` run.
            Auto-generated — review before merging.
          branch: chore/deps-tidy
          base: main
          delete-branch: true
          labels: dependencies
