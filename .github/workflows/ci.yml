# =============================================================================
# CI — run tests on every push to every branch
# =============================================================================
# Catches test failures early, even on branches that are not yet in a PR.
# =============================================================================

name: ci

on:
  push:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests with race detection
        run: go test -race -count=1 -v ./...
